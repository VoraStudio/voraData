site_name: VoraData — Docs
site_author: Pau Crosas Batista
site_description: Arquitectura, flujos SDD, presets y normas técnicas de VoraData
site_url: https://vorastudio.github.io/voraData/

theme:
  name: material
  custom_dir: overrides
  language: ca
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mode clar
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mode fosc
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

nav:
  - Inici: index.md
  - 📋 Normes Globals:
    - normes/index.md
    - Codi: normes/codi.md
    - Git: normes/git.md
    - Lliurament: normes/lliurament.md
    - "Seguretat & LOPD": normes/seguretat.md
  - 🔄 SDD:
    - sdd/index.md
    - Fases: sdd/fases.md
    - "Landing Pages": sdd/landing/index.md
    - Disseny: sdd/design.md
  - 🎨 Presets:
    - presets/index.md
    - "Landing Page":
      - presets/landing/index.md
      - "Sistema de disseny": presets/landing/design-system.md
      - Components: presets/landing/componentes.md
      - Normes: presets/landing/normas.md
  - 🤖 IA & Eines:
    - ia/index.md
    - "DGX Spark": ia/dgx-spark.md
    - OpenCode: ia/opencode.md
    - MCP:
      - Engram: ia/mcp/engram.md
      - OpenSpec: ia/mcp/openspec.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - admonition

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/nav-toggle.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VoraStudio

copyright: Copyright &copy; 2026 VoraData
